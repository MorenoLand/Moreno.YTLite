version: '3'

includes:
  common: ../Taskfile.yml

tasks:
  build:
    summary: Builds the application for macOS
    deps:
      - task: common:go:mod:tidy
      - task: common:build:frontend
        vars:
          PRODUCTION:
            ref: .PRODUCTION
    cmds:
      - go build {{.BUILD_FLAGS}} -o {{.BIN_DIR}}/{{.APP_NAME}}
    vars:
      BUILD_FLAGS: '{{if eq .PRODUCTION "true"}}-tags production -trimpath -buildvcs=false -ldflags="-w -s"{{else}}-buildvcs=false -gcflags=all="-l"{{end}}'
      BIN_DIR: '{{.BIN_DIR | default "bin"}}'
      APP_NAME: '{{.APP_NAME | default "ytlite"}}'
    env:
      GOOS: darwin
      CGO_ENABLED: 1
      GOARCH: '{{.ARCH | default "arm64"}}'
      PRODUCTION: '{{.PRODUCTION | default "false"}}'

  package:
    summary: Creates the production macOS executable
    cmds:
      - task: build
        vars:
          PRODUCTION: "true"

  run:
    cmds:
      - '{{.BIN_DIR | default "bin"}}/{{.APP_NAME | default "ytlite"}}'
