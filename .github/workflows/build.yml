name: Build YTLite

on:
  push:
    branches: [features/wails3]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Windows x64
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26.x'
          cache: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Wails3 CLI
        shell: pwsh
        run: |
          go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-beta.11
          (Join-Path (go env GOPATH) 'bin') | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Install UPX
        shell: pwsh
        run: |
          if (-not (Get-Command upx -ErrorAction SilentlyContinue)) {
            choco install upx -y --no-progress
          }

      - name: Build Wails3 application
        run: wails3 build GOOS=windows ARCH=amd64 PRODUCTION=true

      - name: Resolve release version
        id: release
        shell: pwsh
        run: |
          $version = node -p "require('./frontend/package.json').version"
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Publish Windows executable
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "v${{ steps.release.outputs.version }}"
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag bin/ytlite.exe --clobber
          } else {
            gh release create $tag bin/ytlite.exe --title "YTLite v${{ steps.release.outputs.version }}" --notes "Automated Wails3 build from ${{ github.sha }}."
          }
